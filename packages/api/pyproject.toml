[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor Lineman", email = "git@actuallytaylor.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apiflask>=3.1.3",
    "flask>=3.1.3",
    "greenhouse-lib",
    "pydantic>=2.14.3",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
greenhouse-lib = { workspace = true }
